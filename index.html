<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akoli Speech App</title>
<style>
  :root {
    color-scheme: dark;
    --fg: #ffde17;
    --muted: #ffffff;
    --bg: #050505;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 2rem;
    box-sizing: border-box;
    text-align: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.4;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.75rem, 5vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  h1 .welcome {
    display: block;
    margin-bottom: 0.4em;
    font-size: 0.45em;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  p {
    margin: 0;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .logo {
    width: clamp(140px, 30vw, 240px);
    height: auto;
    display: block;
  }
</style>
</head>
<body>
<img class="logo" src="akolispeech_logo.jpg" alt="Akoli Speech App logo" width="1024" height="1024">
<h1><span class="welcome">Welcome to the</span>Akoli Speech App</h1>
<p>&ndash; coming soon &ndash;</p>
</body>
</html>
